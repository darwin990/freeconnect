<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FreeConnect: conecta clientes y freelancers, gestiona propuestas, contratos, hitos y pagos simulados." />
    <meta name="theme-color" content="#11284f" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>FreeConnect</title>
    <!--
      Aplica el tema guardado antes de pintar para evitar el destello claro/oscuro.
      Debe ejecutarse antes de cargar el CSS de la aplicación.
    -->
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem("freeconnect.theme");
          var root = document.documentElement;
          if (stored === "dark") {
            root.classList.add("dark");
            root.dataset.theme = "dark";
            root.style.colorScheme = "dark";
          } else {
            root.dataset.theme = "light";
          }
        } catch (error) {
          /* localStorage bloqueado: se usa el tema claro por defecto. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
