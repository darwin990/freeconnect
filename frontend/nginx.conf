server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API Spring Boot (mismo origen, sin CORS en el navegador)
    location /api/ {
        proxy_pass http://app:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 10m;
    }

    # Archivos de portafolio servidos por el backend
    location /assets/ {
        proxy_pass http://app:8080/assets/;
        proxy_set_header Host $host;
    }

    # Assets construidos por Vite (JS, CSS, fuentes)
    location /static/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier ruta desconocida vuelve a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
