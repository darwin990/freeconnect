spring:
  datasource:
    url: jdbc:h2:mem:freeconnect-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
  data:
    redis:
      repositories:
        enabled: false

freeconnect:
  security:
    rate-limit:
      enabled: false
  notifications:
    retry-delay: PT1S
    max-attempts: 2
  storage:
    provider: memory

logging:
  level:
    com.freeconnect: WARN
    org.springframework: WARN
