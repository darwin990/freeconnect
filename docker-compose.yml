services:
  postgres:
    image: postgres:16-alpine
    container_name: freeconnect-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-freeconnect}
      POSTGRES_USER: ${POSTGRES_USER:-freeconnect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-freeconnect}
    ports:
      # 5433 en el host para no chocar con un PostgreSQL local en 5432
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-freeconnect} -d ${POSTGRES_DB:-freeconnect}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: freeconnect-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: freeconnect-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-freeconnect}
      DATABASE_USER: ${POSTGRES_USER:-freeconnect}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-freeconnect}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_SECRET: ${JWT_SECRET:-freeconnect-docker-secret-change-me-32bytes-minimum}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@freeconnect.io}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin#FreeConnect2026}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-MOCK}
      STORAGE_PROVIDER: filesystem
      STORAGE_LOCAL_PATH: /app/data/portfolio
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:8080/assets}
      FREECONNECT_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8080}
    ports:
      - "8080:8080"
    volumes:
      - portfolio-data:/app/data/portfolio
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: freeconnect-frontend
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres-data:
  redis-data:
  portfolio-data:
